[bumpversion]
current_version = 1.0.2
commit = True
tag = False
message = chore(core): bump version {current_version} → {new_version} [patch candidate]

[bumpversion:file:pyproject.toml]

[bumpversion:file:README.md]
search = version-{current_version}-blue.svg
replace = version-{new_version}-blue.svg

[bumpversion:file:.bmadrc.yaml]
search = version: {current_version}
replace = version: {new_version}
