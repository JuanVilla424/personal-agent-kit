---
# The installer (bin/_lib.sh, setup_local_qdrant) passes these from the root .env. Run by hand
# with nothing set, it is the default instance: memory-qdrant on 7633 and 7634.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: ${QDRANT_CONTAINER:-memory-qdrant}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-7633}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-7634}:6334"
    volumes:
      - qdrant_memory_storage:/qdrant/storage

volumes:
  qdrant_memory_storage:
    driver: local
