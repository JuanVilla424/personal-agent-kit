---
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: memory-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:7633:6333"
      - "127.0.0.1:7634:6334"
    volumes:
      - qdrant_memory_storage:/qdrant/storage

volumes:
  qdrant_memory_storage:
    driver: local
